<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAC Controller</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container"><header><div><h1>🛡 NAC Controller</h1><p>Network Access Control • Lab dashboard</p></div><button id="refresh" class="primary">Làm mới</button></header>
<section id="summary" class="cards"></section>
<section class="panel"><div class="panel-title"><h2>Thiết bị trong LAN</h2><input id="search" placeholder="Tìm tên, IP, MAC..."></div><div class="table-wrap"><table><thead><tr><th>Tên</th><th>IP</th><th>MAC</th><th>VLAN</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="devices"></tbody></table></div></section>
<section class="grid2"><div class="panel"><h2>Thêm thiết bị</h2><form id="deviceForm"><input name="name" placeholder="Tên thiết bị" required><input name="ip" placeholder="192.168.1.10" required><input name="mac" placeholder="AA:BB:CC:DD:EE:FF" required><input name="vlan" type="number" value="10" min="1" max="4094"><select name="role"><option>staff</option><option>developer</option><option>guest</option><option>camera</option><option>nvr</option><option>printer</option><option>unknown</option></select><select name="status"><option value="pending">pending</option><option value="approved">approved</option><option value="blocked">blocked</option><option value="quarantined">quarantined</option></select><textarea name="notes" placeholder="Ghi chú"></textarea><button class="primary">Thêm</button></form></div>
<div class="panel"><h2>Thêm policy</h2><form id="policyForm"><input name="name" placeholder="Tên policy" required><select name="type"><option>allow</option><option>restrict</option><option>block</option></select><input name="condition" placeholder="192.168.10.0/24 hoặc MAC" required><input name="action" placeholder="allow / quarantine" required><textarea name="description" placeholder="Mô tả"></textarea><button class="primary">Thêm policy</button></form></div></section>
<section class="panel"><h2>Policy hiện tại</h2><div id="policies" class="policy-list"></div></section><section class="panel"><h2>Audit events</h2><div id="events" class="events"></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
