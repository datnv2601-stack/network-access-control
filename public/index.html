<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAC Pro - LAN Device Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { margin-bottom: 30px; }
    h1 { font-size: 32px; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #94a3b8; font-size: 14px; }
    .controls { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .stat-card small { color: #94a3b8; display: block; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: bold; }
    .stat-card.blocked .value { color: #ef4444; }
    .stat-card.approved .value { color: #10b981; }
    .stat-card.pending .value { color: #f59e0b; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
    .panel h2 { font-size: 18px; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; font-weight: 600; color: #cbd5e1; }
    tr:hover { background: #0f172a; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge.unknown { background: #64748b; color: #fff; }
    .badge.approved { background: #10b98126; color: #d1fae5; }
    .badge.blocked { background: #ef444426; color: #fee2e2; }
    .badge.pending { background: #f59e0b26; color: #fef3c7; }
    .actions { display: flex; gap: 6px; }
    .actions button { padding: 6px 10px; font-size: 12px; }
    #deviceTable tbody tr:hover { background: #0f172a; }
    .event-list { max-height: 300px; overflow-y: auto; }
    .event-item { padding: 10px; border-bottom: 1px solid #334155; font-size: 12px; color: #cbd5e1; }
    .event-item.blocked { color: #ef4444; }
    .event-item.approved { color: #10b981; }
    .event-item.pending { color: #f59e0b; }
    .event-item small { color: #64748b; display: block; margin-top: 4px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; color: #cbd5e1; font-size: 12px; font-weight: 600; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .alert.info { background: #3b82f626; color: #bfdbfe; border: 1px solid #3b82f6; }
    .alert.warning { background: #f59e0b26; color: #fef3c7; border: 1px solid #f59e0b; }
    .alert.error { background: #ef444426; color: #fee2e2; border: 1px solid #ef4444; }
    .alert.success { background: #10b98126; color: #d1fae5; border: 1px solid #10b981; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ NAC Pro</h1>
      <p class="subtitle">Network Access Control - Quản lý thiết bị & chặn IP/MAC trong LAN</p>
      <div class="controls">
        <button id="refreshBtn" onclick="loadData()">🔄 Làm mới</button>
        <button id="scanBtn" class="secondary" onclick="scanDemo()">📡 Quét mạng (Demo)</button>
        <button class="danger" onclick="resetAllBlocks()">⚠️ Reset tất cả block</button>
      </div>
    </header>

    <div id="alerts"></div>

    <div class="stats">
      <div class="stat-card"><small>Tổng thiết bị</small><div class="value" id="totalCount">0</div></div>
      <div class="stat-card approved"><small>Approved</small><div class="value" id="approvedCount">0</div></div>
      <div class="stat-card pending"><small>Pending</small><div class="value" id="pendingCount">0</div></div>
      <div class="stat-card blocked"><small>Blocked</small><div class="value" id="blockedCount">0</div></div>
      <div class="stat-card"><small>Blocked Rules</small><div class="value" id="rulesCount">0</div></div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Danh sách thiết bị</h2>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Tên</th>
                <th>IP</th>
                <th>MAC</th>
                <th>Vendor</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
            </thead>
            <tbody id="deviceTable"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>Thêm thiết bị</h2>
        <form onsubmit="addDevice(event)">
          <div class="form-group">
            <label>Tên</label>
            <input id="devName" placeholder="Device name" required>
          </div>
          <div class="form-group">
            <label>IP</label>
            <input id="devIp" placeholder="192.168.1.10" pattern="^(\d{1,3}\.){3}\d{1,3}$" required>
          </div>
          <div class="form-group">
            <label>MAC</label>
            <input id="devMac" placeholder="AA:BB:CC:DD:EE:FF" pattern="^([0-9A-F]{2}:){5}[0-9A-F]{2}$" required>
          </div>
          <div class="form-group">
            <label>Vendor</label>
            <input id="devVendor" placeholder="Intel, Hikvision...">
          </div>
          <button type="submit">Thêm thiết bị</button>
        </form>
        <hr style="margin: 20px 0; border: none; border-top: 1px solid #334155;">
        <h2>Blocked Rules</h2>
        <div id="blockedList" style="max-height: 250px; overflow-y: auto;"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Events & Logs</h2>
      <div id="eventList" class="event-list"></div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    let allDevices = [];
    let allBlocked = [];
    let events = [];

    async function api(url, options = {}) {
      try {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.status === 204 ? null : await res.json();
      } catch (err) {
        showAlert(`API Error: ${err.message}`, 'error');
        throw err;
      }
    }

    function showAlert(msg, type = 'info') {
      const alerts = document.getElementById('alerts');
      const div = document.createElement('div');
      div.className = `alert ${type}`;
      div.textContent = msg;
      alerts.appendChild(div);
      setTimeout(() => div.remove(), 5000);
    }

    async function loadData() {
      try {
        const data = await api(`${API}/devices`);
        allDevices = data.devices || [];
        allBlocked = data.blocked || [];
        
        document.getElementById('totalCount').textContent = data.summary.total;
        document.getElementById('approvedCount').textContent = data.summary.approved;
        document.getElementById('pendingCount').textContent = data.summary.pending;
        document.getElementById('blockedCount').textContent = data.summary.blocked;
        document.getElementById('rulesCount').textContent = data.summary.blockedRules;

        renderDevices();
        renderBlocked();
      } catch (err) {
        console.error(err);
      }
    }

    function renderDevices() {
      const table = document.getElementById('deviceTable');
      table.innerHTML = allDevices.map(d => `
        <tr>
          <td>${d.name}</td>
          <td><code style="background: #0f172a; padding: 2px 6px; border-radius: 4px;">${d.ip}</code></td>
          <td><code style="background: #0f172a; padding: 2px 6px; border-radius: 4px;">${d.mac}</code></td>
          <td>${d.vendor}</td>
          <td><span class="badge ${d.status || 'unknown'}">${d.status || 'unknown'}</span></td>
          <td>
            <div class="actions">
              ${d.status !== 'approved' ? `<button onclick="setStatus(${d.id}, 'approved')">Allow</button>` : ''}
              ${d.status !== 'blocked' ? `<button onclick="setStatus(${d.id}, 'blocked')" class="danger">Block</button>` : ''}
              <button onclick="removeDevice(${d.id})" class="secondary">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderBlocked() {
      const list = document.getElementById('blockedList');
      if (allBlocked.length === 0) {
        list.innerHTML = '<div class="event-item">No blocked devices</div>';
        return;
      }
      list.innerHTML = allBlocked.map(b => `
        <div class="event-item blocked">
          <strong>${b.name}</strong><br>
          IP: ${b.ip} | MAC: ${b.mac}<br>
          <small>${b.reason} • ${new Date(b.blockedAt).toLocaleString('vi-VN')}</small>
          <br><button onclick="unblock(${b.id})" class="secondary" style="padding: 4px 8px; font-size: 11px; margin-top: 6px;">Unblock</button>
        </div>
      `).join('');
    }

    async function setStatus(id, status) {
      try {
        await api(`${API}/devices/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        showAlert(`Device updated to ${status}`, status === 'approved' ? 'success' : 'warning');
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    async function removeDevice(id) {
      if (!confirm('Delete device?')) return;
      try {
        await api(`${API}/devices/${id}`, { method: 'DELETE' });
        showAlert('Device deleted', 'success');
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    async function unblock(id) {
      if (!confirm('Unblock device?')) return;
      try {
        await api(`${API}/blocked/${id}`, { method: 'DELETE' });
        showAlert('Device unblocked', 'success');
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    async function addDevice(e) {
      e.preventDefault();
      const name = document.getElementById('devName').value;
      const ip = document.getElementById('devIp').value;
      const mac = document.getElementById('devMac').value.toUpperCase();
      const vendor = document.getElementById('devVendor').value;

      try {
        await api(`${API}/devices/add`, {
          method: 'POST',
          body: JSON.stringify({ ip, mac, name, vendor })
        });
        showAlert('Device added', 'success');
        e.target.reset();
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    async function scanDemo() {
      const samples = [
        { name: 'Laptop-User-01', ip: '192.168.1.15', mac: 'AA:BB:CC:DD:EE:11', vendor: 'Intel' },
        { name: 'Camera-01', ip: '192.168.1.33', mac: 'AA:BB:CC:DD:EE:22', vendor: 'Hikvision' },
        { name: 'Phone-Samsung', ip: '192.168.1.44', mac: 'AA:BB:CC:DD:EE:33', vendor: 'Samsung' },
        { name: 'Printer-HP', ip: '192.168.1.55', mac: 'AA:BB:CC:DD:EE:44', vendor: 'HP' },
        { name: 'Router-Main', ip: '192.168.1.1', mac: 'AA:BB:CC:DD:EE:FF', vendor: 'TP-Link' }
      ];

      try {
        document.getElementById('scanBtn').disabled = true;
        document.getElementById('scanBtn').textContent = '⏳ Scanning...';
        
        for (let sample of samples) {
          await api(`${API}/devices/add`, {
            method: 'POST',
            body: JSON.stringify(sample)
          });
          await new Promise(r => setTimeout(r, 300));
        }

        showAlert('Scan completed - added devices', 'success');
        loadData();
      } catch (err) {
        console.error(err);
      } finally {
        document.getElementById('scanBtn').disabled = false;
        document.getElementById('scanBtn').textContent = '📡 Quét mạng (Demo)';
      }
    }

    async function resetAllBlocks() {
      if (!confirm('Reset ALL firewall rules? This will unblock everything.')) return;
      try {
        await api(`${API}/firewall/reset`, { method: 'POST' });
        showAlert('All firewall rules cleared', 'warning');
        loadData();
      } catch (err) {
        console.error(err);
      }
    }

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
